name: Rust buffer evaluation
on:
  push:
    branches: ['verify/buffer-windows-v2-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build:wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buffers-wasm
          path: dist/*.wasm
          if-no-files-found: error
  native:
    needs: wasm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        platform:
          - { runner: windows-11-arm, id: win32-arm64-msvc }
          - { runner: windows-2022, id: win32-x64-msvc }
    runs-on: ${{ matrix.platform.runner }}
    env:
      NATIVE_PLATFORM: ${{ matrix.platform.id }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node == '22' && '22.23.4' || matrix.node }}
          package-manager-cache: false
      - name: Install pinned tools and dependencies
        shell: bash
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt,clippy
          echo 'RUSTUP_TOOLCHAIN=1.91.1' >> "$GITHUB_ENV"
          npm ci
          cargo +1.91.1 fetch --manifest-path src/rust/Cargo.toml --locked
      - run: npm run build:js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: buffers-wasm
          path: dist
      - run: npm run build:native
      - run: node scripts/native-environment.mjs
      - run: npm run check:native
      - name: Test every supported instruction set
        shell: bash
        run: npm run test:rust 2>&1 | tee target/buffers-rust-tests.log
      - run: npm run test:native
      - run: npm run test:unit
      - run: npm run test:bench
      - name: Verify the two candidates and benchmark Node 24
        shell: bash
        run: |
          node bench/rust-buffers/prepare.mjs
          node bench/rust-buffers/check-rust.mjs
          node bench/rust-buffers/check.mjs
          if [ "${{ matrix.node }}" = 24 ]; then
            node bench/rust-buffers/run.mjs
            node bench/rust-buffers/export-results.mjs
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: buffers-${{ matrix.platform.id }}-node${{ matrix.node }}
          path: |
            target/native-environment.json
            target/buffers-rust-tests.log
            target/rust-buffers/results/
            target/rust-buffers/manifest.json
          if-no-files-found: error
