name: Release
on:
  push:
    branches: ['verify/release-*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an already-tested candidate from this exact main commit
        type: boolean
        default: false
      candidate_run_id:
        description: Successful Release workflow run that produced the candidate
        type: string
        default: ''
permissions:
  contents: read
jobs:
  javascript-and-wasm:
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/ci.yml
  native:
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/native.yml
    with:
      benchmarks: false
  assemble:
    if: ${{ !inputs.publish }}
    needs: [javascript-and-wasm, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-test-wasm
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: target/release-artifacts
      - run: npm run release:setup
      - run: npm run release:pack
      - run: npm run release:publish -- --dry-run
      - name: Install and test the assembled candidate tarballs
        env:
          RELEASE_CANDIDATE_DIR: target/release-candidate
        run: npm run test:candidate
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify candidate browser bundles
        env:
          RELEASE_CANDIDATE_DIR: target/release-candidate
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: target/release-candidate/
          if-no-files-found: error
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.21.2 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: target/release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - run: npm run release:publish
      - name: Verify installation from the registry
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          mkdir "$RUNNER_TEMP/release-consumer"
          cd "$RUNNER_TEMP/release-consumer"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "escapex@$version"
          node --input-type=module -e "import assert from 'node:assert/strict'; import * as js from 'escapex'; import * as native from 'escapex/native'; for (const name of Object.keys(js)) assert.equal(native[name]('&<>'.repeat(4096)), js[name]('&<>'.repeat(4096)))"
      - name: Create GitHub Release
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          tag="escapex-v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file CHANGELOG.md target/release-candidate/*.tgz target/release-candidate/manifest.json target/release-candidate/SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: publication-receipt
          path: target/release-candidate/publication.json
          if-no-files-found: warn
