name: Collect native selection evidence
on:
  push:
    branches: ['verify/evidence-selection-*']
permissions:
  contents: read
  actions: read
jobs:
  wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Wait for the comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 43219841376 --repo jp-knj/html-escape --interval 30
  collect:
    needs: wait
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64-gnu, linux-x64-gnu, linux-arm64-musl, linux-x64-musl, win32-arm64-msvc, win32-x64-msvc]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection-${{ matrix.target }}-node24
          path: evidence
          run-id: 43219841376
          github-token: ${{ github.token }}
      - name: Export measured evidence through the logs
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { gzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          function find(dir) {
            for (const e of readdirSync(dir, { withFileTypes: true })) {
              const path = join(dir, e.name);
              if (e.isDirectory()) { const found = find(path); if (found) return found; }
              else if (e.name === 'local.json') return path;
            }
          }
          const bytes = readFileSync(find('evidence'));
          const result = JSON.parse(bytes);
          assert.equal(result.environment.target, process.env.EXPECTED_TARGET);
          assert(result.completedAt);
          console.log('SELECTION_SHA256:' + createHash('sha256').update(bytes).digest('hex'));
          console.log('SELECTION_GZIP:' + gzipSync(bytes).toString('base64'));
          JS
