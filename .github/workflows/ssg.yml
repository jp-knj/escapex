name: SSG comparison
on:
  push:
    branches: ['verify/ssg-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build:wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssg-wasm
          path: dist/*.wasm
          if-no-files-found: error
  native:
    needs: wasm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        platform:
          - { runner: macos-15, id: darwin-arm64 }
          - { runner: macos-15-intel, id: darwin-x64 }
          - { runner: ubuntu-22.04-arm, id: linux-arm64-gnu }
          - { runner: ubuntu-22.04, id: linux-x64-gnu }
          - { runner: windows-11-arm, id: win32-arm64-msvc }
          - { runner: windows-2022, id: win32-x64-msvc }
    runs-on: ${{ matrix.platform.runner }}
    env:
      NATIVE_PLATFORM: ${{ matrix.platform.id }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned tools and dependencies
        shell: bash
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.91.1' >> "$GITHUB_ENV"
          npm ci
          cargo +1.91.1 fetch --manifest-path rust/Cargo.toml --locked
          npm ci --prefix bench/astro
          npm ci --prefix bench/competitors --ignore-scripts
      - run: npm run build:js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ssg-wasm
          path: dist
      - run: npm run build:native
      - run: node scripts/native-environment.mjs
      - run: npm run test:bench
      - name: Compare full static builds and verify every output
        run: npm run bench:ssg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ssg-${{ matrix.platform.id }}-node${{ matrix.node }}
          path: |
            target/native-environment.json
            target/ssg-results/
          if-no-files-found: error
  musl:
    needs: wasm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        platform:
          - { runner: ubuntu-24.04-arm, id: linux-arm64-musl }
          - { runner: ubuntu-24.04, id: linux-x64-musl }
    runs-on: ${{ matrix.platform.runner }}
    env:
      NATIVE_PLATFORM: ${{ matrix.platform.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ssg-wasm
          path: target/test-wasm
      - name: Compare full static builds on native musl
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e NATIVE_PLATFORM -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_ACTIONS -e ASTRO_TELEMETRY_DISABLED=1 node:${{ matrix.node }}-alpine3.23 sh -ec '
            apk add --no-cache build-base curl python3
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.91.1
            export PATH="/root/.cargo/bin:$PATH"
            export RUSTFLAGS="-C target-feature=-crt-static"
            npm ci
            cargo fetch --manifest-path rust/Cargo.toml --locked
            npm ci --prefix bench/astro
            npm ci --prefix bench/competitors --ignore-scripts
            npm run build:js
            cp target/test-wasm/*.wasm dist/
            npm run build:native
            node scripts/native-environment.mjs
            npm run test:bench
            npm run bench:ssg
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ssg-${{ matrix.platform.id }}-node${{ matrix.node }}
          path: |
            target/native-environment.json
            target/ssg-results/
          if-no-files-found: error
