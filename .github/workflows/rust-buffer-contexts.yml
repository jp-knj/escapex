name: Rust buffer context evaluation
on:
  push:
    branches: ['verify/buffer-context-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build:wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contexts-wasm
          path: dist/*.wasm
          if-no-files-found: error
  native:
    needs: wasm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
        platform:
          - { runner: macos-15, id: darwin-arm64 }
          - { runner: macos-15-intel, id: darwin-x64 }
          - { runner: ubuntu-22.04-arm, id: linux-arm64-gnu }
          - { runner: ubuntu-22.04, id: linux-x64-gnu }
          - { runner: windows-11-arm, id: win32-arm64-msvc }
          - { runner: windows-2022, id: win32-x64-msvc }
    runs-on: ${{ matrix.platform.runner }}
    env:
      NATIVE_PLATFORM: ${{ matrix.platform.id }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node == '22' && '22.23.4' || matrix.node }}
          package-manager-cache: false
      - name: Install pinned tools and dependencies
        shell: bash
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt,clippy
          echo 'RUSTUP_TOOLCHAIN=1.91.1' >> "$GITHUB_ENV"
          npm ci
          cargo +1.91.1 fetch --manifest-path src/rust/Cargo.toml --locked
      - run: npm run build:js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexts-wasm
          path: dist
      - run: npm run build:native
      - run: node scripts/native-environment.mjs
      - run: npm run check:native
      - name: Test every supported instruction set
        shell: bash
        run: npm run test:rust 2>&1 | tee target/contexts-rust-tests.log
      - run: npm run test:native
      - run: npm run test:unit
      - run: npm run test:bench
      - name: Verify the two candidates and benchmark Node 24
        shell: bash
        run: |
          node bench/rust-buffers/prepare.mjs
          node bench/rust-buffers/check-rust.mjs
          node bench/rust-buffers/check.mjs
          if [ "${{ matrix.node }}" = 24 ]; then
            node bench/rust-buffers/context-run.mjs
            node bench/rust-buffers/context-export.mjs
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contexts-${{ matrix.platform.id }}-node${{ matrix.node }}
          path: |
            target/native-environment.json
            target/contexts-rust-tests.log
            target/rust-buffers/results/
            target/rust-buffers/contexts/
            target/rust-buffers/manifest.json
          if-no-files-found: error
  musl:
    needs: wasm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
        platform:
          - { runner: ubuntu-24.04-arm, id: linux-arm64-musl }
          - { runner: ubuntu-24.04, id: linux-x64-musl }
    runs-on: ${{ matrix.platform.runner }}
    env:
      NATIVE_PLATFORM: ${{ matrix.platform.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexts-wasm
          path: target/test-wasm
      - name: Test and measure on native musl
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e NATIVE_PLATFORM -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_REPOSITORY -e GITHUB_ACTIONS node:${{ matrix.node }}-alpine3.23 sh -ec '
            set -o pipefail
            apk add --no-cache build-base curl python3 git
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.91.1
            export PATH="/root/.cargo/bin:$PATH"
            rustup component add rustfmt clippy
            export RUSTFLAGS="-C target-feature=-crt-static"
            npm ci
            cargo fetch --manifest-path src/rust/Cargo.toml --locked
            npm run build:js
            cp target/test-wasm/*.wasm dist/
            npm run build:native
            node scripts/native-environment.mjs
            npm run test:rust 2>&1 | tee target/contexts-rust-tests.log
            npm run test:native
            npm run test:unit
            npm run test:bench
            node bench/rust-buffers/prepare.mjs
            node bench/rust-buffers/check-rust.mjs
            node bench/rust-buffers/check.mjs
            if [ "${{ matrix.node }}" = 24 ]; then
              node bench/rust-buffers/context-run.mjs
              node bench/rust-buffers/context-export.mjs
            fi
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contexts-${{ matrix.platform.id }}-node${{ matrix.node }}
          path: |
            target/native-environment.json
            target/contexts-rust-tests.log
            target/rust-buffers/results/
            target/rust-buffers/contexts/
            target/rust-buffers/manifest.json
          if-no-files-found: error
