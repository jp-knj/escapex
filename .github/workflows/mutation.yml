name: Mutation tests
on:
  pull_request:
    paths:
      - 'src/escape.ts'
      - 'src/unescape.ts'
      - 'src/native-platform.ts'
      - 'src/native-libc.ts'
      - 'src/wasm.ts'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'stryker.config.mjs'
      - 'tsdown.config.mts'
      - 'tsdown.mutation.config.mts'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test test/mutation/summarize.test.mjs
      - run: npm run test:mutation
      - name: Summarize detected faults and survivors
        run: |
          npm run --silent test:mutation:summary > target/mutation/summary.json
          cat target/mutation/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report
          path: target/mutation/
          if-no-files-found: error
