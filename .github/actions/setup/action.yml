name: Set up build tools
description: Install pinned Node dependencies, Rust and Binaryen
inputs:
  node:
    description: Node.js version
    default: '24'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node }}
        package-manager-cache: false
    - shell: bash
      run: |
        rustup toolchain install 1.91.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
        echo 'RUSTUP_TOOLCHAIN=1.91.1' >> "$GITHUB_ENV"
        archive=binaryen-version_117-x86_64-linux.tar.gz
        curl --fail --location --silent --show-error "https://github.com/WebAssembly/binaryen/releases/download/version_117/$archive" --output "$RUNNER_TEMP/$archive"
        cd "$RUNNER_TEMP"
        echo "3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212  $archive" | sha256sum --check
        tar -xzf "$archive"
        echo "WASM_OPT=$RUNNER_TEMP/binaryen-version_117/bin/wasm-opt" >> "$GITHUB_ENV"
    - shell: bash
      run: npm ci
